<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Minesweeper: Level Rush — Play in Browser</title>
    <meta name="description" content="Play Minesweeper: Level Rush directly in your browser.">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style id="minesweeper-portrait-layout">
      html, body { width: 100%; height: 100%; overflow: hidden; background: #282828; }
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: none;
      }
      #unity-canvas,
      .unity-mobile #unity-canvas {
        width: min(100vw, 56.25vh) !important;
        height: min(100vh, 177.77777778vw) !important;
        width: min(100vw, 56.25dvh) !important;
        height: min(100dvh, 177.77777778vw) !important;
        aspect-ratio: 9 / 16;
      }
      #unity-footer { display: none; }
    </style>
    <script data-minesweeper-analytics src="analytics-config.js"></script>
    <script data-minesweeper-analytics src="analytics.js"></script>
    <style id="minesweeper-loading-experience">
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(100vw, 56.25vh);
        height: min(100vh, 177.77777778vw);
        width: min(100vw, 56.25dvh);
        height: min(100dvh, 177.77777778vw);
        aspect-ratio: 9 / 16;
        transform: translate(-50%, -50%);
        overflow: hidden;
        opacity: 1;
        background: #802D2E url("TemplateData/SplashScreen.png") center / contain no-repeat;
        transition: opacity 220ms ease-out;
      }
      #unity-loading-bar.is-complete { opacity: 0; pointer-events: none; }
      #unity-loading-progress {
        position: absolute;
        left: clamp(16px, 6%, 32px);
        right: clamp(16px, 6%, 32px);
        bottom: clamp(18px, 3.5%, 36px);
        padding: 10px 12px 8px;
        border: 1px solid rgba(255, 255, 255, 0.58);
        border-radius: 8px;
        background: rgba(20, 20, 20, 0.78);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.45);
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 12px;
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.52);
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        margin: 0;
        border-radius: 5px;
        background: linear-gradient(90deg, #d9d9d9, #ffffff);
      }
      #unity-progress-bar-empty.is-preparing #unity-progress-bar-full {
        width: 34% !important;
        animation: minesweeper-preparing-progress 1.15s ease-in-out infinite;
      }
      #unity-progress-percent {
        margin-top: 5px;
        color: #ffffff;
        font: 600 14px/1.1 Arial, Helvetica, sans-serif;
        text-align: center;
        text-shadow: 0 1px 2px #000000;
      }
      @keyframes minesweeper-preparing-progress {
        from { transform: translateX(-130%); }
        to { transform: translateX(390%); }
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-progress">
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
          <div id="unity-progress-percent">0%</div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Minesweeper Level Rush</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      var minesweeperLoadingBar = document.querySelector("#unity-loading-bar");
      var minesweeperProgressTrack = document.querySelector("#unity-progress-bar-empty");
      var minesweeperProgressBar = document.querySelector("#unity-progress-bar-full");
      var minesweeperProgressLabel = document.querySelector("#unity-progress-percent");
      var minesweeperUnityRuntimeReady = false;
      var minesweeperGameContentReady = false;

      function setMinesweeperLoadingProgress(progress) {
        var normalizedProgress = Math.max(0, Math.min(1, progress));
        var percent = Math.round(100 * normalizedProgress);
        minesweeperProgressBar.style.width = 100 * normalizedProgress + "%";
        minesweeperProgressLabel.textContent = percent + "%";
      }

      function tryHideMinesweeperLoadingExperience() {
        if (!minesweeperUnityRuntimeReady || !minesweeperGameContentReady ||
            minesweeperLoadingBar.classList.contains("is-complete")) {
          return;
        }

        minesweeperProgressTrack.classList.remove("is-preparing");
        minesweeperLoadingBar.classList.add("is-complete");
        try {
          if (window.minesweeperAnalytics &&
              typeof window.minesweeperAnalytics.trackEvent === "function") {
            window.minesweeperAnalytics.trackEvent("unity_loaded");
          }
        } catch (error) {
        }
        window.setTimeout(function () {
          minesweeperLoadingBar.style.display = "none";
        }, 220);
      }

      function markMinesweeperUnityRuntimeReady() {
        minesweeperUnityRuntimeReady = true;
        minesweeperProgressTrack.classList.add("is-preparing");
        minesweeperProgressLabel.textContent = "Preparing game…";
        tryHideMinesweeperLoadingExperience();
      }

      window.minesweeperGameReady = function () {
        minesweeperGameContentReady = true;
        tryHideMinesweeperLoadingExperience();
      };

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLGitHubPages.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLGitHubPages.data.unityweb",
        frameworkUrl: buildUrl + "/WebGLGitHubPages.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGLGitHubPages.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        autoSyncPersistentDataPath: true,
        companyName: "Corriscant",
        productName: "Minesweeper Level Rush",
        productVersion: "1.0.29",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          setMinesweeperLoadingProgress(progress);
              }).then((unityInstance) => {
                markMinesweeperUnityRuntimeReady();
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
